:root { --tinta:#14235c; --tinta-suave:#4a5683; --cielo:#dfeefb; --ultramar:#2446d6; --ultramar-osc:#1a34a8; --sol:#f7b21b; --sol-claro:#fff0c2; --coral:#e8553f; --menta:#19826a; --papel:#fff; --borde:#c9d8ec; --r:20px; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin:0; background:var(--cielo); color:var(--tinta); font-family:"Lexend", system-ui, "Segoe UI", sans-serif; font-size:.98rem; line-height:1.6; }
h1,h2,h3,.marca,.btn,.fecha-bloque,.avatar,.titulo { font-family:"Bricolage","Lexend",system-ui,sans-serif; }
a { color:var(--ultramar); }
:focus-visible { outline:3px solid var(--sol); outline-offset:2px; border-radius:6px; }
.visually-hidden { position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.oculto { display:none!important; }
.fila { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; }

/* Barra */
.barra { background:var(--papel); border-bottom:2px solid var(--tinta); }
.contenedor { max-width:1240px; margin:0 auto; padding:.6rem 1rem; display:flex; flex-wrap:wrap; align-items:center; gap:.6rem 1rem; }
.marca { display:inline-flex; align-items:center; gap:.55rem; font-weight:800; font-size:1.45rem; letter-spacing:-.02em; color:var(--tinta)!important; text-decoration:none; }
.marca svg { width:38px; height:38px; flex:none; }
.marca small { font-family:"Lexend",sans-serif; font-size:.7rem; font-weight:700; background:var(--sol); padding:.1rem .5rem; border-radius:999px; }
.nav-pestanas { display:flex; flex-wrap:wrap; gap:.35rem; flex:1 1 auto; }
.nav-pestanas a { color:var(--tinta); text-decoration:none; padding:.35rem .75rem; border-radius:999px; font-weight:700; font-size:.92rem; white-space:nowrap; font-family:"Bricolage",sans-serif; }
.nav-pestanas a:hover { background:var(--cielo); }
.nav-pestanas a.activa { background:var(--tinta); color:#fff; }
.sesion { display:flex; align-items:center; gap:.6rem; }
.sesion .nombre { font-weight:700; font-size:.92rem; line-height:1.2; text-align:right; }
.sesion .nombre small { display:block; font-weight:400; color:var(--tinta-suave); font-size:.78rem; }

/* Botones y formularios */
.btn { font-weight:700; border-radius:999px; padding:.4rem 1.1rem; border:2px solid transparent; cursor:pointer; font-size:1rem; transition:transform .12s ease, background .12s ease; line-height:1.4; }
.btn-sm { padding:.2rem .8rem; font-size:.88rem; }
.btn-p { background:var(--ultramar); border-color:var(--ultramar); color:#fff; }
.btn-p:hover { background:var(--ultramar-osc); border-color:var(--ultramar-osc); transform:translateY(-1px); }
.btn-o { background:#fff; border-color:var(--borde); color:var(--tinta); }
.btn-o:hover { background:var(--cielo); border-color:var(--tinta); }
.btn-s { background:var(--tinta); border-color:var(--tinta); color:#fff; }
.btn-salir { background:#fff; border-color:var(--tinta); color:var(--tinta); }
.btn-salir:hover { background:var(--tinta); color:#fff; }
.btn-d { background:#fff; border-color:var(--coral); color:var(--coral); }
.btn-d:hover { background:var(--coral); color:#fff; }
.btn-ok { background:var(--menta); border-color:var(--menta); color:#fff; }
.btn-w { background:var(--sol); border-color:var(--sol); color:var(--tinta); }
.btn-x { background:var(--coral); border-color:var(--coral); color:#fff; }
.btn-bloque { width:100%; }
label { font-weight:700; display:block; margin-bottom:.25rem; }
input[type=text], input[type=password], input[type=date], input[type=url], select, textarea { width:100%; border:2px solid var(--borde); border-radius:12px; padding:.45rem .8rem; font:inherit; color:var(--tinta); background:#fff; }
input:focus, select:focus, textarea:focus { outline:none; border-color:var(--ultramar); box-shadow:0 0 0 3px rgba(36,70,214,.2); }
input[type=file] { width:100%; font:inherit; }
.campo { margin-bottom:.75rem; }
.fila-campos { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:.5rem; margin-bottom:.5rem; }
.chico input, .chico { font-size:.9rem; }
.alerta { max-width:720px; margin:0 auto 1rem; border-radius:14px; border:2px solid; padding:.65rem 1rem; font-weight:700; }
.alerta.ok { background:#d4f0e8; border-color:var(--menta); color:#0d5a47; }
.alerta.error { background:#fde3df; border-color:var(--coral); color:#8a2415; }
.alerta.aviso { background:var(--sol-claro); border-color:var(--sol); }
.alerta.info { background:#dbe4ff; border-color:var(--ultramar); color:var(--ultramar-osc); }
.pagina { max-width:1240px; margin:0 auto; padding:1.75rem 1rem 3rem; }
.muro { max-width:720px; margin:0 auto; }
.titulo { font-size:clamp(1.9rem,4vw,2.6rem); font-weight:800; letter-spacing:-.03em; line-height:1.05; margin:0 0 1.25rem; }
h2.sec { font-size:1.3rem; font-weight:800; letter-spacing:-.02em; margin:2rem 0 .75rem; }
.tarjeta { background:var(--papel); border:2px solid var(--borde); border-radius:var(--r); padding:1rem 1.1rem; margin-bottom:.75rem; }
.peq { font-size:.88rem; color:var(--tinta-suave); }
code { color:var(--ultramar-osc); background:var(--sol-claro); padding:0 .3rem; border-radius:6px; }

/* Avatares */
.avatar { display:inline-flex; align-items:center; justify-content:center; width:42px; height:42px; border-radius:50%; font-weight:800; font-size:.95rem; color:#fff; flex:none; letter-spacing:.02em; }
.avatar.chico { width:28px; height:28px; font-size:.68rem; }
.rol-estudiante { background:var(--ultramar); } .rol-docente { background:var(--menta); } .rol-adscripto { background:#7a45c9; } .rol-direccion { background:var(--tinta); } .rol-admin { background:var(--coral); }
.insignia { display:inline-block; font-size:.78rem; font-weight:700; padding:0 .5rem; border-radius:999px; background:var(--cielo); }

/* Redactar */
.redactar { background:var(--papel); border:2px solid var(--tinta); border-radius:var(--r); padding:.9rem 1rem; margin-bottom:1.5rem; box-shadow:5px 5px 0 var(--tinta); }
.redactar summary { list-style:none; display:flex; align-items:center; gap:.75rem; cursor:pointer; }
.redactar summary::-webkit-details-marker { display:none; }
.redactar .pregunta { flex:1; background:var(--cielo); color:var(--tinta-suave); border-radius:999px; padding:.6rem 1.1rem; font-weight:700; font-family:"Bricolage",sans-serif; }
.redactar[open] .pregunta { background:var(--sol-claro); color:var(--tinta); }
.redactar form { margin-top:1rem; }

/* Publicaciones */
.pub { background:var(--papel); border:2px solid var(--borde); border-radius:var(--r); padding:1.1rem 1.25rem; margin-bottom:1.25rem; }
.pub-cab { display:flex; align-items:center; gap:.7rem; margin-bottom:.75rem; flex-wrap:wrap; }
.pub-cab .quien { line-height:1.2; flex:1; min-width:0; }
.pub-cab .quien strong { display:block; font-family:"Bricolage",sans-serif; }
.pub-cab .cuando { font-size:.82rem; color:var(--tinta-suave); }
.pub h2 { font-size:1.4rem; font-weight:800; letter-spacing:-.02em; line-height:1.15; margin:0 0 .4rem; }
.pub .texto { margin:0 0 .9rem; white-space:pre-wrap; }
@media (max-width:520px) { .pub-cab .cuando { flex-basis:100%; order:3; } }
.pub-noticia { border-top:8px solid var(--ultramar); }
.pub-anuncio { background:var(--sol); border-color:var(--tinta); box-shadow:5px 5px 0 var(--tinta); }
.pub-anuncio .cuando { color:var(--tinta); }
.pub-anuncio .insignia { background:var(--tinta); color:#fff; }
.pub-anuncio h2 { font-size:1.7rem; }
.pub-anuncio .btn-o { border-color:var(--tinta); }

    if (!p || p.estado !== 'publicada' || m.length < 3) decir('Escribí el motivo del reporte (de 3 a 300 caracteres).', 'error');
    else { S.reports.push({ id: nid('r'), pub: id, reportero: me.id, motivo: m, estado: 'nuevo', revisor: null, resolucion: null, creado: Date.now() }); p.estado = 'oculta'; registrar('reportar', 'pub ' + id); decir('Gracias por avisar. El contenido quedó oculto hasta que un moderador lo revise.'); }
  } else if (k === 'reportar_com') {
    var cc = S.comments.filter(function (x) { return x.id === id; })[0], m2 = v.motivo.value.trim();
    if (!cc || cc.estado !== 'visible' || cc.autor === me.id || m2.length < 3) decir('Escribí el motivo del reporte (de 3 a 300 caracteres).', 'error');
    else { S.reports.push({ id: nid('r'), pub: cc.pub, com: cc.id, reportero: me.id, motivo: m2, estado: 'nuevo', revisor: null, resolucion: null, creado: Date.now() }); cc.estado = 'oculto'; registrar('reportar', 'comentario ' + cc.id); decir('Gracias por avisar. El comentario quedó oculto hasta que un moderador lo revise.'); }
  } else if (k === 'votar') {
    var ev = S.encuestas.filter(function (x) { return x.id === id; })[0], oid = +(v.op.value || 0);
    if (!ev || !encAbierta(ev) || !ev.ops.some(function (o) { return o.id === oid; }) || (ev.grupo && !verGrupo(me, ev.grupo))) decir('No se pudo registrar el voto.', 'error');
    else { if (ev.votos[me.id] == null) ev.votos[me.id] = oid; decir('Voto registrado. Gracias por participar.'); }
  } else if (k === 'crear_enc') {
    var q = v.pregunta.value.trim(), ops = v.opciones.value.split(/\r?\n/).map(function (x) { return x.trim(); }).filter(Boolean), g2 = +v.destino.value || null, ci = v.cierra.value, er = null;
    if (!puedePublicar(me)) er = 'No tenés permiso para crear encuestas.';
    else if (q.length < 5 || q.length > 200) er = 'La pregunta debe tener de 5 a 200 caracteres.';
    else if (ops.length < 2 || ops.length > 6) er = 'Escribí de 2 a 6 opciones, una por línea.';
    else if (ops.some(function (x) { return x.length > 80; })) er = 'Cada opción puede tener hasta 80 caracteres.';
    else if (prohibidas(q + ' ' + ops.join(' '))) er = 'La encuesta contiene palabras no permitidas.';
    else if (g2 && !verGrupo(me, g2)) er = 'No podés crear encuestas en ese grupo.';
    else if (ci && (!fechaValida(ci) || ci < fd0(0))) er = 'La fecha de cierre no es válida.';
    if (er) decir(er, 'error');
    else { var es2 = esStaff(me) ? 'publicada' : 'pendiente'; S.encuestas.push({ id: nid('e'), autor: me.id, pregunta: q, grupo: g2, estado: es2, cierra: ci || null, ops: ops.map(function (t) { return { id: nid('o'), texto: t }; }), votos: {} }); registrar('encuesta', 'creada (' + es2 + ')'); decir(es2 === 'pendiente' ? 'Encuesta enviada. Queda pendiente hasta que la apruebe un docente, adscripto o dirección.' : 'Encuesta publicada.'); }
  } else if (k === 'crear_fecha') {
    var ft = v.titulo.value.trim(), fdsc = v.desc.value.trim(), ff = v.fecha.value, fg = +v.destino.value || null, fe2 = null;
    if (!esStaff(me)) fe2 = 'Solo el equipo del liceo puede cargar fechas.';
    else if (ft.length < 3 || ft.length > 100 || fdsc.length > 300) fe2 = 'Completá el título (de 3 a 100 caracteres). La descripción admite hasta 300.';
    else if (!fechaValida(ff)) fe2 = 'La fecha no es válida.';
    else if (prohibidas(ft + ' ' + fdsc)) fe2 = 'El texto contiene palabras no permitidas.';
    else if (!fg && !esDir(me)) fe2 = 'Las fechas para todo el liceo las carga dirección. Elegí un grupo.';
    else if (fg && !verGrupo(me, fg)) fe2 = 'No podés cargar fechas en ese grupo.';
    if (fe2) decir(fe2, 'error');
    else { S.fechas.push({ id: nid('f'), titulo: ft, desc: fdsc, fecha: ff, grupo: fg, autor: me.id }); registrar('fecha', 'creada: ' + ft); decir('Fecha agregada al calendario.'); }
  } else if (k === 'activar') {
    var us = S.users.filter(function (u) { return u.usuario === v.usuario.value.trim() && !u.activa && u.codigo && u.estado === 'activo'; })[0];
    if (!us || us.codigo !== v.codigo.value.trim().toUpperCase()) decir('Usuario o código incorrectos.', 'error');
    else if (v.clave.value.length < 8 || v.clave.value !== v.clave2.value) decir('La contraseña debe tener al menos 8 caracteres y ser igual en los dos campos.', 'error');
    else if (!v.normas.checked) decir('Tenés que aceptar las normas de convivencia.', 'error');
    else { us.activa = true; us.codigo = null; registrar('activar'); decir('Cuenta activada. Ya podés entrar desde la pantalla de inicio.'); location.hash = ''; }
  } else if (k === 'usuario') {
    var nom = v.nombre.value.trim(), ap = v.apellido.value.trim(), base = slug(nom + ' ' + ap) || 'usuario', un = base, i = 1;
    while (S.users.some(function (u) { return u.usuario === un; })) un = base + (++i);
    var cod = codigo(), nu = { id: nid('u'), nombre: nom, apellido: ap, usuario: un, rol: v.rol.value, puede: 0, estado: 'activo', codigo: cod, activa: false };
    S.users.push(nu); Array.prototype.forEach.call(f.querySelectorAll('input[name=grupos]:checked'), function (c) { S.gu.push([+c.value, nu.id]); });
    registrar('crear_usuario', un + ' (' + nu.rol + ')'); decir('Cuenta creada. Usuario: ' + un + ' · Código de activación: ' + cod);
  } else if (k === 'grupos_usuario') {
    var tu = U(id);
    if (tu && tu.estado !== 'eliminado' && me.rol === 'admin') { S.gu = S.gu.filter(function (x) { return x[1] !== id; }); Array.prototype.forEach.call(f.querySelectorAll('input[name=grupos]:checked'), function (c) { S.gu.push([+c.value, id]); }); registrar('grupos', 'usuario ' + id); decir('Grupos actualizados.'); }
  } else if (k === 'grupo') {
    var gn = v.nombre.value.trim();
    if (gn && !S.groups.some(function (g) { return g.nombre === gn; })) { S.groups.push({ id: nid('g'), nombre: gn }); registrar('crear_grupo', gn); decir('Grupo creado.'); }
  }
  guardar(); pedir();
});
window.addEventListener('hashchange', pedir);
render();
})();
